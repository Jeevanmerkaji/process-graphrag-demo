# Reference extraction (manually annotated) for virtual_validation.md
document: virtual_validation.md
entities:
  - {type: Process, name: Virtual Validation, description: "Validation of designs by computer-aided engineering (CAE) simulation."}
  - {type: Activity, name: Define load cases, description: "Define the load cases for the simulation from requirements and geometry.", evidence: "| Define load cases | Simulation Engineer |"}
  - {type: Activity, name: Prepare simulation model, description: "Prepare and mesh the simulation model from the CAD model.", evidence: "| Prepare simulation model | Simulation Engineer |"}
  - {type: Activity, name: Run simulation, description: "Solve the simulation model for the defined load cases.", evidence: "| Run simulation | Simulation Engineer |"}
  - {type: Activity, name: Evaluate and report simulation, description: "Evaluate simulation results and write the simulation report.", evidence: "| Evaluate and report | Simulation Engineer |"}
  - {type: Activity, name: Correlate simulation with test, description: "Compare simulation results with physical test results.", evidence: "| Correlate with test | Simulation Engineer, Test Engineer |"}
  - {type: Role, name: Simulation Engineer, description: "Engineer who performs CAE simulations."}
  - {type: Role, name: Test Engineer, description: "Engineer who plans, runs and evaluates physical tests."}
  - {type: Artifact, name: Requirements Specification, description: "Technical requirements for the component or vehicle."}
  - {type: Artifact, name: CAD Model, description: "3D geometry of the component."}
  - {type: Artifact, name: Load Case Definition, description: "Definition of loads and boundary conditions for the simulation."}
  - {type: Artifact, name: Simulation Model, description: "Meshed model prepared for the solver."}
  - {type: Artifact, name: Simulation Results, description: "Raw solver results."}
  - {type: Artifact, name: Simulation Report, description: "Report with the results of a virtual validation."}
  - {type: Artifact, name: Test Report, description: "Report with the results of a physical test."}
  - {type: Artifact, name: Correlation Report, description: "Comparison of simulation and test results."}
  - {type: Tool, name: Requirements management tool, description: "System for managing requirements."}
  - {type: Tool, name: CAE pre-processor, description: "Software for geometry preparation and meshing."}
  - {type: Tool, name: HPC cluster, description: "High-performance computing cluster running the CAE solver."}
  - {type: Tool, name: CAE post-processor, description: "Software for evaluating simulation results."}
  - type: Requirement
    name: Reuse existing load case definitions
    description: Load cases are re-defined from scratch for each project because existing definitions are hard to find.
    evidence: "Load cases are re-defined from scratch for each project; existing definitions are hard to find"
    need_type: information_retrieval
    effort_hours_per_month: 50
  - type: Requirement
    name: Reduce meshing effort
    description: Meshing the simulation model takes about 40% of the total simulation effort.
    evidence: "Meshing takes about 40% of the total simulation effort"
    need_type: analysis
    effort_hours_per_month: 200
  - type: Requirement
    name: Evaluate more design variants
    description: Long solver run times limit the number of design variants that can be simulated.
    evidence: "Long solver run times limit the number of design variants"
    need_type: analysis
    effort_hours_per_month: 80
  - type: Requirement
    name: Draft simulation reports
    description: Simulation reports are written manually and comparison with earlier variants is tedious.
    evidence: "Reports are written manually; comparison with earlier variants is tedious"
    need_type: authoring
    effort_hours_per_month: 60
  - type: Requirement
    name: Link test and simulation data
    description: Test and simulation data are stored in different systems, which makes correlation difficult.
    evidence: "Test and simulation data are stored in different systems"
    need_type: consolidation
    effort_hours_per_month: 25
